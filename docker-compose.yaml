services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
      POSTGRES_DB: ccdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d ccdev"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ccdev:ccdev@db:5432/ccdev
      TOKEN_SECRET: change-me-in-production
    ports:
      - "8000:8000"

volumes:
  pgdata:
